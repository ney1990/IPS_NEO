name: IPS-NEO build
on:
  push:
    branches: [main]
  pull_request:

# Read-only CI: public pull requests must not receive write access to source.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
